steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.frontend
      - --build-arg=APP=$_APP
      - --build-arg=VITE_API_URL=$_VITE_API_URL
      - --build-arg=VITE_STUDENT_APP_URL=$_VITE_STUDENT_APP_URL
      - --build-arg=VITE_TEACHER_APP_URL=$_VITE_TEACHER_APP_URL
      - --build-arg=VITE_GOOGLE_CLIENT_ID=$_VITE_GOOGLE_CLIENT_ID
      - --tag=$_IMAGE
      - .
images:
  - $_IMAGE
